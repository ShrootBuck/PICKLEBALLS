name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Code and migration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run db:validate
      - run: bun scripts/ci/check-migration-history.ts
      - run: bun run lint
      - run: bunx next typegen
      - run: bun run typecheck
      - run: bun test
      - name: Upgrade a populated disposable database and run integration tests
        run: bun run test:social

  build:
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the production Docker target without production credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: pickleballs-check:${{ matrix.target }}
          load: true
          push: false
          cache-from: type=gha,scope=pickleballs-${{ matrix.target }}
          cache-to: type=gha,scope=pickleballs-${{ matrix.target }},mode=max
      - name: Verify the image contains its release identity
        env:
          TARGET: ${{ matrix.target }}
          COMMIT: ${{ github.sha }}
        run: test "$(docker run --rm --entrypoint cat "pickleballs-check:$TARGET" /app/.release-commit)" = "$COMMIT"
      - name: Start the image and apply migrations against disposable Postgres
        env:
          TARGET: ${{ matrix.target }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/ci/smoke-image.sh "$TARGET" "$COMMIT"

  deploy:
    name: Deploy and verify production
    needs: [checks, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PB_CI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # Never cancel a release between its migration and worker replacement.
    concurrency:
      group: pickleballs-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Promote tested commit, migrate, and verify web then worker
        env:
          PB_RELEASE_COMMIT: ${{ github.sha }}
        run: bun scripts/ci/deploy.ts
