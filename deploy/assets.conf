server {
    listen 8080;
    server_name _;
    root /srv/static;
    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /health {
        access_log off;
        return 200 'ok';
    }
}
